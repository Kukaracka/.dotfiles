[opener]
# Чем открывать файлы (плейсхолдеры yazi 26.x: %s = все выбранные файлы, %s1 = первый)
edit = [
    { run = 'nvim %s', block = true, desc = "NeoVim" },
]
play_alt = [
    { run = 'mpv %s', orphan = true, desc = "MPV" },
]

copy = [
    { run = 'wl-copy < %s1', orphan = true, desc = "Clipboard" },
]

play = [
    { run = 'vlc %s', orphan = true, desc = "VLC" },
]

open_img = [
    { run = 'gwenview %s', orphan = true, desc = "Gwenview" },
]

browser = [
    { run = 'zen-browser %S1', orphan = true, desc = "Zen Browser" },
]

extract = [
    { run = 'for f in %s; do ouch d -y "$f"; done', block = true, desc = "Extract here with ouch" },
]
[open]
rules = [
	# Folder
	{ mime = "folder/*", use = [ "edit", "open", "reveal", "copy"] },
	# HTML
	{ mime = "text/html", use = [ "edit", "browser", "reveal", "copy" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal", "copy" ] },
	# Image
	{ mime = "image/*", use = ["open_img" , "open", "reveal" , "copy"] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "play_alt", "reveal" , "copy"] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# JSON
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" , "copy"] },
	{ mime = "*/javascript", use = [ "edit", "reveal" , "copy"] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" , "copy"] },
	# Virtual file system
	# { mime = "vfs/{absent,stale}", use = "download", "copy" },
	# Video by extension (must stay before the "*" fallback)
	{ url = "*.mkv", use = [ "play","play_alt", "edit" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal", "copy" ] },
]
