# Font
# font_family      JetBrains Mono Nerd Font
# font_size 12.0

# font_family FantasqueSansM Nerd Font Mono Bold
# font_family Fira Mono
font_family JetBrains Mono SemiBold


font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 1
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
# cursor_trail 1
# change to x11 or wayland or leave auto
linux_display_server wayland

scrollback_lines 2000
wheel_scroll_min_lines 1
wheel_scroll_multiplier 1.0

enable_audio_bell no

window_padding_width 0
# selection_foreground none
# selection_background none
# foreground #dddddd
# background #000000
# cursor #dddddd



# Cursor
cursor_shape beam
cursor_trail 0

# Padding (why weird value? consistency with foot)
window_margin_width 0

# No stupid close confirmation
confirm_os_window_close 0

# Use fish shell
shell fish


# Настройка удаленного управления (критично для работы плагина)
allow_remote_control yes
listen_on unix:/tmp/mykitty
shell_integration enabled



# Copy
map ctrl+c    copy_or_interrupt

# Search
map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

include ./gruvbox_dark_soft.conf


include themes/noctalia.conf
# ====================== ХОТКЕИ КАК В TMUX ======================
# Перемещение между панелями
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window up
map alt+down  neighboring_window down

# Вкладки (Alt + 1-9)
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
map alt+0 goto_tab 10

# Размер панелей
map alt+shift+left  resize_window narrower 5
map alt+shift+right resize_window wider 5
map alt+shift+up    resize_window taller 3
map alt+shift+down  resize_window shorter 3

# Сплиты в текущей директории (как split-window в tmux)
map alt+h launch --location=hsplit --cwd=current
map alt+v launch --location=vsplit --cwd=current

# Окна/вкладки
# map alt+t new_window_with_cwd
map alt+t new_tab
map alt+q close_window
map alt+shift+q quit
map alt+r set_tab_title

# Аналог tmux copy-mode: поиск по скроллбеку с копированием
map alt+/ search_scrollback
map alt+p load_config_file
